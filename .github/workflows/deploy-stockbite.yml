name: Deploy StockBite to Somee

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate required secrets
        shell: powershell
        run: |
          function Test-Secret {
            param(
              [string]$Value,
              [string]$Name
            )

            if ([string]::IsNullOrWhiteSpace($Value)) {
              throw "Missing required GitHub secret: $Name"
            }
          }

          Test-Secret "${{ secrets.FTP_SERVER }}" "FTP_SERVER"
          Test-Secret "${{ secrets.FTP_USERNAME }}" "FTP_USERNAME"
          Test-Secret "${{ secrets.FTP_PASSWORD }}" "FTP_PASSWORD"

          $smtpHost = "${{ secrets.SMTP_HOST }}"
          if ([string]::IsNullOrWhiteSpace($smtpHost)) {
            $smtpHost = "${{ secrets.EMAIL_HOST }}"
          }

          $smtpPort = "${{ secrets.SMTP_PORT }}"
          if ([string]::IsNullOrWhiteSpace($smtpPort)) {
            $smtpPort = "${{ secrets.EMAIL_PORT }}"
          }

          $smtpSenderEmail = "${{ secrets.SMTP_SENDER_EMAIL }}"
          if ([string]::IsNullOrWhiteSpace($smtpSenderEmail)) {
            $smtpSenderEmail = "${{ secrets.EMAIL_SENDER_EMAIL }}"
          }

          $smtpSenderName = "${{ secrets.SMTP_SENDER_NAME }}"
          if ([string]::IsNullOrWhiteSpace($smtpSenderName)) {
            $smtpSenderName = "${{ secrets.EMAIL_SENDER_NAME }}"
          }

          $smtpUsername = "${{ secrets.SMTP_USERNAME }}"
          if ([string]::IsNullOrWhiteSpace($smtpUsername)) {
            $smtpUsername = "${{ secrets.EMAIL_USERNAME }}"
          }

          $smtpPassword = "${{ secrets.SMTP_PASSWORD }}"
          if ([string]::IsNullOrWhiteSpace($smtpPassword)) {
            $smtpPassword = "${{ secrets.EMAIL_PASSWORD }}"
          }

          $smtpEnableSsl = "${{ secrets.SMTP_ENABLE_SSL }}"
          if ([string]::IsNullOrWhiteSpace($smtpEnableSsl)) {
            $smtpEnableSsl = "true"
          }

          Test-Secret $smtpHost "SMTP_HOST or EMAIL_HOST"
          Test-Secret $smtpPort "SMTP_PORT or EMAIL_PORT"
          Test-Secret $smtpSenderEmail "SMTP_SENDER_EMAIL or EMAIL_SENDER_EMAIL"
          Test-Secret $smtpSenderName "SMTP_SENDER_NAME or EMAIL_SENDER_NAME"
          Test-Secret $smtpUsername "SMTP_USERNAME or EMAIL_USERNAME"
          Test-Secret $smtpPassword "SMTP_PASSWORD or EMAIL_PASSWORD"
          Test-Secret $smtpEnableSsl "SMTP_ENABLE_SSL"

      - name: Restore
        run: dotnet restore ./StockBite/StockBite.csproj

      - name: Publish
        run: dotnet publish ./StockBite/StockBite.csproj -c Release -o ./publish

      - name: Inject settings into published appsettings
        shell: powershell
        run: |
          $path = ".\publish\appsettings.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json

          if (-not $json.Authentication) {
            $json | Add-Member -MemberType NoteProperty -Name Authentication -Value ([pscustomobject]@{})
          }

          if (-not $json.Authentication.Google) {
            $json.Authentication | Add-Member -MemberType NoteProperty -Name Google -Value ([pscustomobject]@{})
          }

          if (-not $json.Email) {
            $json | Add-Member -MemberType NoteProperty -Name Email -Value ([pscustomobject]@{})
          }

          $googleClientId = "${{ secrets.GOOGLE_CLIENT_ID }}"
          $googleClientSecret = "${{ secrets.GOOGLE_CLIENT_SECRET }}"

          $emailHost = "${{ secrets.SMTP_HOST }}"
          if ([string]::IsNullOrWhiteSpace($emailHost)) {
            $emailHost = "${{ secrets.EMAIL_HOST }}"
          }

          $emailPort = "${{ secrets.SMTP_PORT }}"
          if ([string]::IsNullOrWhiteSpace($emailPort)) {
            $emailPort = "${{ secrets.EMAIL_PORT }}"
          }

          $senderEmail = "${{ secrets.SMTP_SENDER_EMAIL }}"
          if ([string]::IsNullOrWhiteSpace($senderEmail)) {
            $senderEmail = "${{ secrets.EMAIL_SENDER_EMAIL }}"
          }

          $senderName = "${{ secrets.SMTP_SENDER_NAME }}"
          if ([string]::IsNullOrWhiteSpace($senderName)) {
            $senderName = "${{ secrets.EMAIL_SENDER_NAME }}"
          }

          $emailUsername = "${{ secrets.SMTP_USERNAME }}"
          if ([string]::IsNullOrWhiteSpace($emailUsername)) {
            $emailUsername = "${{ secrets.EMAIL_USERNAME }}"
          }

          $emailPassword = "${{ secrets.SMTP_PASSWORD }}"
          if ([string]::IsNullOrWhiteSpace($emailPassword)) {
            $emailPassword = "${{ secrets.EMAIL_PASSWORD }}"
          }

          $emailEnableSsl = "${{ secrets.SMTP_ENABLE_SSL }}"
          if ([string]::IsNullOrWhiteSpace($emailEnableSsl)) {
            $emailEnableSsl = "true"
          }

          if (-not [string]::IsNullOrWhiteSpace($googleClientId)) {
            $json.Authentication.Google.ClientId = $googleClientId
          }

          if (-not [string]::IsNullOrWhiteSpace($googleClientSecret)) {
            $json.Authentication.Google.ClientSecret = $googleClientSecret
          }

          $json.Email.Host = $emailHost
          $json.Email.Port = [int]$emailPort
          $json.Email.SenderEmail = $senderEmail
          $json.Email.SenderName = $senderName
          $json.Email.Username = $emailUsername
          $json.Email.Password = $emailPassword
          $json.Email.EnableSsl = [System.Convert]::ToBoolean($emailEnableSsl)

          $json | ConvertTo-Json -Depth 10 | Set-Content $path

      - name: Confirm injected email settings
        shell: powershell
        run: |
          $path = ".\publish\appsettings.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json

          if ([string]::IsNullOrWhiteSpace($json.Email.Host)) {
            throw "Published appsettings.json has empty Email.Host"
          }

          if ([string]::IsNullOrWhiteSpace($json.Email.SenderEmail)) {
            throw "Published appsettings.json has empty Email.SenderEmail"
          }

          if ([string]::IsNullOrWhiteSpace($json.Email.Username)) {
            throw "Published appsettings.json has empty Email.Username"
          }

          if ([string]::IsNullOrWhiteSpace($json.Email.Password)) {
            throw "Published appsettings.json has empty Email.Password"
          }

          Write-Host "Email settings were injected successfully."

      - name: Upload app_offline.htm
        shell: powershell
        run: |
          $root = "ftp://${{ secrets.FTP_SERVER }}/www.Stockbite.somee.com"
          $credentials = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          $content = [System.Text.Encoding]::UTF8.GetBytes("StockBite is updating. Please refresh in a minute.")
          $request = [System.Net.FtpWebRequest]::Create("$root/app_offline.htm")
          $request.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
          $request.Credentials = $credentials
          $request.UseBinary = $true
          $request.KeepAlive = $false
          $request.ContentLength = $content.Length
          $stream = $request.GetRequestStream()
          $stream.Write($content, 0, $content.Length)
          $stream.Close()
          $response = $request.GetResponse()
          $response.Close()
          Start-Sleep -Seconds 5

      - name: Upload published files with PowerShell FTP
        shell: powershell
        run: |
          $publishPath = Resolve-Path ".\publish"
          $root = "ftp://${{ secrets.FTP_SERVER }}/www.Stockbite.somee.com"
          $credentials = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")

          function New-FtpDirectoryIfMissing {
            param([string]$DirectoryUrl)

            try {
              $request = [System.Net.FtpWebRequest]::Create($DirectoryUrl)
              $request.Method = [System.Net.WebRequestMethods+Ftp]::MakeDirectory
              $request.Credentials = $credentials
              $request.UseBinary = $true
              $request.KeepAlive = $false
              $response = $request.GetResponse()
              $response.Close()
            }
            catch {
            }
          }

          $directories = Get-ChildItem -Path $publishPath -Directory -Recurse | Sort-Object FullName
          foreach ($directory in $directories) {
            $relative = $directory.FullName.Substring($publishPath.Path.Length).TrimStart('\').Replace('\', '/')
            if (-not [string]::IsNullOrWhiteSpace($relative)) {
              New-FtpDirectoryIfMissing -DirectoryUrl "$root/$relative"
            }
          }

          $files = Get-ChildItem -Path $publishPath -File -Recurse
          foreach ($file in $files) {
            $relative = $file.FullName.Substring($publishPath.Path.Length).TrimStart('\').Replace('\', '/')
            $targetUrl = "$root/$relative"
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $request = [System.Net.FtpWebRequest]::Create($targetUrl)
            $request.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
            $request.Credentials = $credentials
            $request.UseBinary = $true
            $request.KeepAlive = $false
            $request.ContentLength = $bytes.Length
            $stream = $request.GetRequestStream()
            $stream.Write($bytes, 0, $bytes.Length)
            $stream.Close()
            $response = $request.GetResponse()
            $response.Close()
          }

      - name: Remove app_offline.htm
        if: always()
        shell: powershell
        run: |
          $request = [System.Net.FtpWebRequest]::Create("ftp://${{ secrets.FTP_SERVER }}/www.Stockbite.somee.com/app_offline.htm")
          $request.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
          $request.Credentials = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          $request.UseBinary = $true
          $request.KeepAlive = $false
          try {
            $response = $request.GetResponse()
            $response.Close()
          }
          catch {
            Write-Host "app_offline.htm was not present or could not be deleted. Continuing."
          }
