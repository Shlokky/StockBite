name: Deploy StockBite to Somee

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./StockBite/StockBite.csproj

      - name: Publish
        run: dotnet publish ./StockBite/StockBite.csproj -c Release -o ./publish

      - name: Inject Google OAuth settings into published appsettings
        shell: powershell
        run: |
          $path = ".\publish\appsettings.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          if (-not $json.Authentication) {
            $json | Add-Member -MemberType NoteProperty -Name Authentication -Value (@{})
          }
          if (-not $json.Authentication.Google) {
            $json.Authentication | Add-Member -MemberType NoteProperty -Name Google -Value (@{})
          }
          $json.Authentication.Google.ClientId = "${{ secrets.GOOGLE_CLIENT_ID }}"
          $json.Authentication.Google.ClientSecret = "${{ secrets.GOOGLE_CLIENT_SECRET }}"
          $json | ConvertTo-Json -Depth 10 | Set-Content $path

      - name: Create app_offline file
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\deploy-offline | Out-Null
          Set-Content -Path .\deploy-offline\app_offline.htm -Value "StockBite is updating. Please refresh in a minute."

      - name: Put Somee site offline
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-offline/
          server-dir: /www.Stockbite.somee.com/

      - name: Deploy published files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /www.Stockbite.somee.com/
          dangerous-clean-slate: true
